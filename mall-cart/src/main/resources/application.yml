spring:
  application:
    name: mall-cart

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    compatibility-verifier:
      enabled: false
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456

server:
  port: 8040

jwt:
  secret: afei-mall-jwt-secret-prod-32-chars-min

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.afei.mall.cart.controller
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.afei: debug

seata:
  tx-service-group: afei-mall-group
  service:
    vgroup-mapping:
      afei-mall-group: default
    grouplist:
      default: localhost:8091
  data-source-proxy-mode: AT

# 服务间内部接口凭证（/internal/** 鉴权，Feign 自动携带）
internal:
  token: afei-mall-internal-token-2024
