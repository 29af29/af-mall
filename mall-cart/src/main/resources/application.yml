spring:
  application:
    name: mall-cart

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    compatibility-verifier:
      enabled: false
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456

server:
  port: 8040

jwt:
  secret: afei-mall-jwt-secret-prod-32-chars-min

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.afei.mall.cart.controller
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.afei: debug
