spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: mall-product

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    compatibility-verifier:
      enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  datasource:
    url: jdbc:mysql://localhost:3306/afei_product?useSSL=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}

  rabbitmq:
    host: 192.168.100.128
    port: 5672
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /
    connection-timeout: 5000

server:
  port: 8030

jwt:
  secret: ${JWT_SECRET:}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.afei.mall.product.controller
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.afei: debug

aliyun:
  oss:
    endpoint: oss-cn-beijing.aliyuncs.com
    # 密钥从环境变量读取，切勿写入代码库
    accessKeyId: ${OSS_ACCESS_KEY_ID:}
    accessKeySecret: ${OSS_ACCESS_KEY_SECRET:}
    bucketName: java-af-mall
    url: https://java-af-mall.oss-cn-beijing.aliyuncs.com
seata:
  tx-service-group: afei-mall-group
  service:
    vgroup-mapping:
      afei-mall-group: default
    grouplist:
      default: localhost:8091
  data-source-proxy-mode: AT

# 服务间内部接口凭证（/internal/** 鉴权，Feign 自动携带）
internal:
  token: ${INTERNAL_TOKEN:}
