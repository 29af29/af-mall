spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: mall-order

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    sentinel:
      transport:
        dashboard: localhost:8858
        port: 8719
    compatibility-verifier:
      enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/afei_order?useSSL=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}

  rabbitmq:
    host: 192.168.100.128
    port: 5672
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /
    connection-timeout: 5000

server:
  port: 8050

jwt:
  secret: ${JWT_SECRET:}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.afei.mall.order.controller
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
seata:
  tx-service-group: afei-mall-group
  service:
    vgroup-mapping:
      afei-mall-group: default
    grouplist:
      default: localhost:8091
  data-source-proxy-mode: AT

# 服务间内部接口凭证（/internal/** 鉴权，Feign 自动携带）
internal:
  token: ${INTERNAL_TOKEN:}
