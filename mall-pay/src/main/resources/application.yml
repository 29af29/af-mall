spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: mall-pay

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    compatibility-verifier:
      enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/afei_pay?useSSL=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  rabbitmq:
    host: 192.168.100.128
    port: 5672
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /
    connection-timeout: 5000

server:
  port: 8060

jwt:
  secret: ${JWT_SECRET:}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.afei.mall.pay.controller
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.afei: debug

seata:
  tx-service-group: afei-mall-group
  service:
    vgroup-mapping:
      afei-mall-group: default
    grouplist:
      default: localhost:8091
  data-source-proxy-mode: AT

# 服务间内部接口凭证（/internal/** 鉴权，Feign 自动携带）
internal:
  token: ${INTERNAL_TOKEN:}

# 支付回调签名密钥（HMAC-SHA256 验签）
pay:
  callback-secret: ${PAY_CALLBACK_SECRET:}
